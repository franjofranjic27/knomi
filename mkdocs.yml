site_name: knomi
site_description: Token-efficient document ingestion and RAG connector for local AI agents
site_url: https://franjofranjic27.github.io/knomi/
repo_url: https://github.com/franjofranjic27/knomi
repo_name: franjofranjic27/knomi

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - ADRs:
      - Vector Store: adr/ADR-001-vector-store.md
      - Token Chunking: adr/ADR-002-token-chunking.md
      - SHA-256 Dedup: adr/ADR-003-sha256-dedup.md
  - Commit Convention: COMMIT_CONVENTION.md
  - Testing: TESTING.md
  - CI/CD Workflows: WORKFLOWS.md
  - Troubleshooting: troubleshooting.md
